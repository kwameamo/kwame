<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — David Kwame Amo</title>
  <link rel="icon" type="image/png" href="/photos/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff;
      color: #000;
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px;
    }
    .num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #757575; }
    .num::before { content: 'º6 '; }
    .scene { display: grid; gap: 16px; }
    h1 { font-size: clamp(30px, 6vw, 40px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
    .copy { font-size: 17px; color: #555; max-width: 40ch; }
    .copy strong { font-weight: 400; color: #000; }
    .cta { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #000; text-underline-offset: 4px; width: max-content; }
    .site-mark { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #757575; margin-top: 48px; }
    ::selection { background: #000; color: #fff; }
  </style>
</head>
<body>

<div class="scene">
  <span class="num">404 / page not found</span>
  <h1>Nothing here.</h1>


  <p class="copy">
    This page doesn't exist.<br>
    <strong>Or it did — and now it's gone.</strong>
  </p>

  <a href="/" class="cta">Return home →</a>
</div>

<p class="site-mark">kwame.vision</p>

</body>
</html>
