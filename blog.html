<body class="nt-body">

<!-- Folder view -->
<div class="nt-folder" id="nt-folder">
    <header class="nt-top" id="nt-top">
        <a class="nt-round lg" href="/index.html" aria-label="Home"><svg aria-hidden="true"><use href="#nt-i-back"/></svg></a>
        <p class="nt-top__title" id="nt-top-title" aria-hidden="true">Blog</p>
        <button type="button" class="nt-round lg" id="nt-more" aria-label="More" aria-expanded="false" aria-controls="nt-menu"><svg aria-hidden="true"><use href="#nt-i-more"/></svg></button>
    </header>
    <div class="nt-menu lg" id="nt-menu" role="menu">
        <a role="menuitem" href="/roll.html"><span>Open B-Roll</span><svg aria-hidden="true"><use href="#nt-i-photos"/></svg></a>
        <a role="menuitem" href="/index.html#work"><span>See Projects</span><svg aria-hidden="true"><use href="#nt-i-grid"/></svg></a>
        <button type="button" role="menuitem" data-theme-toggle="label"></button>
        <button type="button" role="menuitem" id="nt-copy-folder"><span>Copy Link</span><svg aria-hidden="true"><use href="#nt-i-link"/></svg></button>
    </div>

    <main class="nt-main" id="main">
        <h1 class="nt-title" id="nt-title">Blog</h1>
        <p class="nt-count" id="nt-count">&nbsp;</p>
        <div class="nt-groups" id="nt-groups" aria-live="polite">
            <section class="nt-group nt-skeleton" aria-hidden="true">
                <div class="nt-card"><span class="nt-sk"></span><span class="nt-sk"></span><span class="nt-sk"></span></div>
            </section>
        </div>
    </main>

    <div class="nt-bar">
        <label class="nt-search lg">
            <svg aria-hidden="true"><use href="#nt-i-search"/></svg>
            <input type="search" id="nt-q" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search notes">
            <button type="button" class="nt-search__clear" id="nt-clear" aria-label="Clear search" hidden><svg aria-hidden="true"><use href="#nt-i-x"/></svg></button>
        </label>
        <a class="nt-round nt-round--big lg" href="/index.html#inquire" aria-label="Write to me"><svg aria-hidden="true"><use href="#nt-i-compose"/></svg></a>
    </div>
</div>

<!-- An open note -->
<article class="nt-reader" id="nt-reader" aria-hidden="true" aria-labelledby="nt-r-title">
    <header class="nt-reader__top">
        <button type="button" class="nt-round lg" id="nt-back" aria-label="Back to notes"><svg aria-hidden="true"><use href="#nt-i-back"/></svg></button>
        <div class="nt-pill lg">
            <button type="button" class="nt-pill__btn" id="nt-share" aria-label="Share note"><svg aria-hidden="true"><use href="#nt-i-share"/></svg></button>
            <button type="button" class="nt-pill__btn" id="nt-rmore" aria-label="More" aria-expanded="false" aria-controls="nt-rmenu"><svg aria-hidden="true"><use href="#nt-i-more"/></svg></button>
        </div>
    </header>
    <div class="nt-menu nt-menu--reader lg" id="nt-rmenu" role="menu">
        <button type="button" role="menuitem" data-theme-toggle="label"></button>
        <button type="button" role="menuitem" id="nt-copy"><span>Copy Link</span><svg aria-hidden="true"><use href="#nt-i-link"/></svg></button>
        <button type="button" role="menuitem" id="nt-prev"><span>Newer Note</span><svg aria-hidden="true"><use href="#nt-i-up"/></svg></button>
        <button type="button" role="menuitem" id="nt-next"><span>Older Note</span><svg aria-hidden="true"><use href="#nt-i-down"/></svg></button>
    </div>
    <div class="nt-reader__scroll" id="nt-scroll">
        <div class="nt-reader__inner">
            <p class="nt-stamp" id="nt-stamp"></p>
            <h2 class="nt-r-title" id="nt-r-title"></h2>
            <div class="nt-r-body" id="nt-r-body"></div>
            <p class="nt-r-folder" id="nt-r-folder"></p>
        </div>
    </div>
    <footer class="nt-reader__bar">
        <div class="nt-pill lg">
            <button type="button" class="nt-pill__btn" id="nt-up" aria-label="Newer note"><svg aria-hidden="true"><use href="#nt-i-up"/></svg></button>
            <span class="nt-pill__count" id="nt-pos"></span>
            <button type="button" class="nt-pill__btn" id="nt-down" aria-label="Older note"><svg aria-hidden="true"><use href="#nt-i-down"/></svg></button>
        </div>
        <a class="nt-round nt-round--big lg" href="/index.html#inquire" aria-label="Write to me"><svg aria-hidden="true"><use href="#nt-i-compose"/></svg></a>
    </footer>
</article>
<p class="nt-toast lg" id="nt-toast" role="status"><span id="nt-toast-text"></span></p>
