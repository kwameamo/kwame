[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "blog-meta"
  path = "/blog.html"

[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404
  force = true

# In-house brands are promoted with links, not case studies
[[redirects]]
  from = "/work/foldsvtg.html"
  to = "https://foldsvtg.kwame.vision/"
  status = 301
  force = true

[[redirects]]
  from = "/work/vision97.html"
  to = "https://vision97.vision"
  status = 301
  force = true

[[redirects]]
  from = "/work/curiolabs.html"
  to = "https://curiolabs.dev"
  status = 301
  force = true
